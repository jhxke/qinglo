[workspace]
members = [
    "mining-app",
    "operator_runtime",
    "operator/datasource_operator",
    "operator/ma_operator",
    "operator/rsi_operator",
    "operator/macd_operator",
    "operator/expression_operator",
    "operator/kline_visualization_operator",
    "operator/line_chart_operator",
    "operator/ollama_operator",
    "operator/chat_visualization_operator",
    "operator/cumsum_operator",
    "operator/shift_add_operator",
    "operator/merge_operator",
    "operator/future_return_operator",
    "operator/volatility_operator",
    "operator/return_histogram_operator",
    "operator/histogram_visualization_operator",
    "operator/price_volume_factor_operator",
    "operator/factor_histogram_operator",
    "operator/highest_operator",
    "operator/daily_return_operator",
    "operator_executor_client",
    "operator_sdk",
    "operator_runtime_server",
]

resolver = "2"

[profile.release]
strip = "symbols"
opt-level = 3
codegen-units = 1

[profile.dev]
strip = false
opt-level = 0
codegen-units = 1