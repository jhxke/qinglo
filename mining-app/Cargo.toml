[package]
name = "mining-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "image", "advanced", "markdown", "advanced-shaping", "tiny-skia"] }
# iced_aw 0.14 与 iced 0.14 兼容，按需启用 features 控制依赖体积
# card       → 建模/算子卡片
# tab_bar    → 顶部 Tab + 左侧子 Tab + 日志分类 Tab
# badge      → 计数徽章
# context_menu → 画布/节点右键菜单
# labeled_frame → 参数面板分组
# sidebar    → 备用（左侧合并面板可选用）
# spinner    → 加载中占位
# menu/quad → context_menu 与分隔线依赖
iced_aw = { version = "0.14", default-features = false, features = [
    "badge", "card", "context_menu", "labeled_frame", "menu", "quad", "sidebar", "spinner", "tab_bar", "tabs",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
libloading = "0.8"
tempfile = "3"
lazy_static = "1"
once_cell = "1"
operator_executor_client = { path = "../operator_executor_client" }
rfd = "0.14"
# 图片解码仅用于「品牌设置 → 从文件加载 Logo」分支，按需启用 png/jpeg
# 两个 codec，避免拉入 gif/webp/avif 等额外依赖。版本与 iced 0.14 内部
# 依赖的 image 0.24 对齐，统一版本避免 Cargo 双版本编译开销。
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# wry 仅用于 Windows 下的 WebView2 菜单/富文本试验（build_as_child 嵌入 iced 主窗口）。
# 关闭 default-features 避免拉入 Linux(gtk/webkit/x11/tao) 依赖。
[target.'cfg(windows)'.dependencies]
wry = { version = "0.56", default-features = false }
