[package]
name = "mining-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "image", "advanced", "markdown", "advanced-shaping", "tiny-skia"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
libloading = "0.8"
tempfile = "3"
lazy_static = "1"
once_cell = "1"
operator_executor_client = { path = "../operator_executor_client" }
rfd = "0.14"
